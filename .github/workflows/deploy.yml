name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: luxfi/markets

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    uses: hanzoai/universe/.github/workflows/reusable-deploy-service.yml@main
    with:
      service: markets
      image: ghcr.io/luxfi/markets:${{ github.sha }}
      cluster: lux-k8s
      namespace: lux
      health-url: https://markets.lux.network
    secrets:
      HANZO_API_KEY: ${{ secrets.HANZO_API_KEY }}
